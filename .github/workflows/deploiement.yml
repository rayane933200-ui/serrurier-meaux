# Construit le site de Meaux et le publie sur GitHub Pages à chaque
# `git push` sur main.
#
# Troisième hébergement envisagé le 26 octobre 2026 : o2switch, puis Cloudflare
# Pages, puis GitHub Pages. C'est celui-ci qui est en place. Le site de Lyon
# reste chez o2switch : les deux dépôts n'ont plus la même chaîne de
# publication, et ce fichier ne doit PAS être recopié de l'un à l'autre.
#
# Aucun secret à renseigner. La publication passe par le jeton que GitHub
# fournit lui-même à l'exécution (`id-token`), pas par une clé d'API à stocker.
# C'est le seul avantage net de GitHub Pages sur les deux autres hébergements.
#
# Ce que GitHub Pages ne sait PAS faire, et qui est donc perdu :
#   · les en-têtes HTTP personnalisés. X-Content-Type-Options, X-Frame-Options
#     et Permissions-Policy n'ont pas d'équivalent en balise meta et ne sont
#     plus envoyés. Seule la politique de référent a été récupérée, par un
#     <meta name="referrer"> dans BaseLayout.
#   · la politique de contenu (CSP), pour la même raison.
#   · le contrôle du cache. GitHub Pages impose le sien.
#
# Ce qu'il sait faire :
#   · la redirection www → apex, automatiquement, dès lors que les deux noms
#     sont configurés en DNS et que le domaine personnalisé du dépôt est l'apex.
#   · le HTTPS, par certificat Let's Encrypt renouvelé tout seul.
#   · la page 404, en servant /404.html.
#
# PIÈGE : sans le fichier public/.nojekyll, GitHub Pages fait passer le site par
# Jekyll, qui supprime tout dossier commençant par un souligné. Il effacerait
# donc /_astro/, c'est-à-dire la TOTALITÉ du CSS et du JavaScript. Le site
# s'afficherait en texte brut. Le contrôle plus bas refuse de publier sans lui.

name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Permet aussi de relancer un déploiement à la main depuis l'onglet Actions,
  # utile pour republier sans avoir à modifier quoi que ce soit.
  workflow_dispatch:

# Droits requis par la publication GitHub Pages. Volontairement limités à ça :
# `contents: read` suffit pour lire le dépôt, le workflow n'écrit rien dedans.
permissions:
  contents: read
  pages: write
  id-token: write

# Deux pushes rapprochés ne doivent pas publier en même temps. On n'annule PAS
# le déploiement en cours : contrairement à un envoi FTP, une publication Pages
# interrompue laisse le site dans son état précédent, et il vaut mieux attendre
# la fin de la première que de la couper au milieu.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    # Exigé par actions/deploy-pages : c'est cet environnement qui porte l'URL
    # publiée, visible dans l'onglet Actions une fois le déploiement terminé.
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build

      # Garde-fou : si le domaine venait à disparaître de la configuration, le
      # sitemap partirait sur localhost sans que rien ne le signale. On refuse
      # de publier plutôt que de mettre en ligne un site inindexable.
      - name: Vérifier les URL produites
        run: |
          if grep -q "localhost" dist/sitemap-0.xml; then
            echo "::error::Le sitemap contient des URL localhost, publication annulée."
            exit 1
          fi
          # Sans .nojekyll, GitHub Pages passe le site par Jekyll, qui supprime
          # tout dossier commençant par un souligné — donc /_astro/, c'est-à-dire
          # tout le CSS et tout le JavaScript. Le site s'afficherait en texte
          # brut. C'est la panne la plus spectaculaire de cette plateforme, et
          # elle tient à un fichier vide.
          if [ ! -f dist/.nojekyll ]; then
            echo "::error::dist/.nojekyll absent : Jekyll supprimerait /_astro/, le site perdrait tout son CSS."
            exit 1
          fi
          # Le CNAME porte le domaine personnalisé. Sans lui, GitHub Pages
          # retombe sur l'adresse en github.io et le domaine ne répond plus.
          if [ ! -f dist/CNAME ]; then
            echo "::error::dist/CNAME absent : le domaine personnalisé serait perdu."
            exit 1
          fi
          attendu=$(grep -o '<loc>https://[^/]*' dist/sitemap-0.xml | head -1 | sed 's|<loc>https://||')
          if [ "$(cat dist/CNAME)" != "$attendu" ]; then
            echo "::error::dist/CNAME vaut '$(cat dist/CNAME)' alors que le sitemap annonce '$attendu'."
            exit 1
          fi
          # Contrôle de fond : /_astro/ doit contenir quelque chose.
          if [ -z "$(ls -A dist/_astro 2>/dev/null)" ]; then
            echo "::error::dist/_astro vide : le site n'aurait ni CSS ni JavaScript."
            exit 1
          fi
          # Fichier de preuve IndexNow. Sans lui, les soumissions repartent en
          # 403 alors qu'aucune page du site ne paraît cassée : la panne serait
          # invisible jusqu'à ce qu'on aille lire les journaux.
          if ! find dist -maxdepth 1 -regextype posix-extended \
               -regex '.*/[0-9a-f]{8,128}\.txt' | grep -q .; then
            echo "::error::Fichier de preuve IndexNow absent de dist/."
            exit 1
          fi
          # Fichier de validation Bing Webmaster Tools. Même logique que
          # ci-dessus : Bing revérifie la propriété périodiquement, et une
          # propriété qui perd sa validation cesse de remonter ses données
          # sans qu'aucune page du site ne paraisse cassée.
          if [ ! -f dist/BingSiteAuth.xml ]; then
            echo "::error::dist/BingSiteAuth.xml absent : la propriété Bing perdrait sa validation."
            exit 1
          fi
          # URL internes sans slash final dans les données structurées.
          #
          # Le site est en trailingSlash: 'always' : une URL sans slash final
          # part en 301. Deux balisages ItemList en déclaraient ainsi, et Google
          # a passé des semaines à explorer 23 URL qui redirigent toutes — elles
          # ressortaient en « Page avec redirection » dans Search Console, du
          # budget d'exploration dépensé pour rien.
          #
          # Rien ne paraissait cassé : les pages s'affichaient, les liens
          # visibles étaient corrects, seul le JSON-LD mentait. D'où ce contrôle.
          #
          # Le contrôle ne porte que sur NOTRE domaine : un lien externe n'a pas
          # à suivre notre convention de slash. L'hôte est lu dans le sitemap
          # plutôt qu'écrit en dur, pour suivre un éventuel changement de domaine.
          #
          # Les ancres #business et #website sont des identifiants d'entité, pas
          # des adresses à explorer : elles sont exclues.
          hote=$(grep -o '<loc>https://[^/]*' dist/sitemap-0.xml | head -1 | sed 's|<loc>https://||')
          echo "Contrôle des URL internes pour l'hôte $hote"
          mauvaises=$(grep -rhoE "\"https://${hote}/[a-z0-9/-]*[a-z0-9]\"" dist --include='*.html' \
            | grep -vE '#|\.(png|webp|jpg|jpeg|xml|txt|ico|svg)"' | sort -u || true)
          if [ -n "$mauvaises" ]; then
            echo "::error::URL sans slash final dans les données structurées :"
            echo "$mauvaises"
            exit 1
          fi
          # grep -o puis wc -l : le sitemap tient sur une seule ligne, compter
          # les lignes renverrait toujours 1.
          pages=$(grep -o '<loc>' dist/sitemap-0.xml | wc -l)
          echo "$pages pages, .nojekyll, CNAME, clé IndexNow et validation Bing présents."
          if [ "$pages" -lt 40 ]; then
            echo "::error::Seulement $pages pages dans le sitemap, construction incomplète."
            exit 1
          fi

      # PRÉALABLE OBLIGATOIRE, et il n'est pas automatisable :
      # GitHub Pages doit être activé sur le dépôt, par Settings → Pages →
      # Build and deployment → Source = « GitHub Actions ».
      #
      # Sans ça, cette étape échoue en une seconde :
      #   Get Pages site failed. Error: Not Found
      #
      # L'option `enablement: true` a été essayée le 26 octobre 2026 pour s'en
      # passer.
      # Ça ne fonctionne pas : le jeton fourni au workflow peut publier sur un
      # site Pages existant, pas en créer un. L'API répond
      #   Create Pages site failed. Error: Resource not accessible by integration
      # L'option a donc été retirée — elle ajoutait une seconde erreur sans
      # régler la première, ce qui rendait le journal plus difficile à lire.
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      # include-hidden-files : sans cette option, .nojekyll n'est PAS embarqué
      # dans l'archive, et on retombe exactement sur la panne qu'il évite.
      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          include-hidden-files: true

      - name: Publier sur GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      # IndexNow prévient Bing, Yandex, Seznam et Naver qu'une page a changé, au
      # lieu d'attendre leur prochain passage. Google n'en fait pas partie :
      # c'est un complément à Search Console, pas un remplaçant.
      #
      # Ces trois étapes viennent APRÈS l'envoi : annoncer une page avant
      # qu'elle soit en ligne enverrait les moteurs sur l'ancienne version.
      - name: Récupérer les empreintes du déploiement précédent
        uses: actions/cache/restore@v4
        with:
          path: empreintes-indexnow.json
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-

      - name: Signaler les pages modifiées à IndexNow
        id: indexnow
        # Un refus des moteurs ne doit pas faire échouer un déploiement qui,
        # lui, a réussi : le site est en ligne. L'erreur reste visible dans le
        # récapitulatif de l'exécution.
        continue-on-error: true
        # Pas de clé ici : le script la lit dans dist/<clé>.txt, généré depuis
        # site.ts. Une seule source, donc aucune divergence possible.
        run: node .github/scripts/indexnow.mjs

      # Les empreintes ne sont conservées que si la soumission a abouti : sinon
      # le prochain déploiement croirait ces pages déjà annoncées.
      - name: Conserver les empreintes
        if: steps.indexnow.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: empreintes-indexnow.json
          key: indexnow-${{ github.run_id }}
